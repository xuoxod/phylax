[package]
name = "phylax"
version = "0.1.0"
edition = "2021"
authors = ["Rick <xuoxod@gmail.com>", "RMediaTech Contributors"]
license = "MIT OR Apache-2.0"
description = "Sovereign 12-layer zero-telemetry edge defense, honeypot traps, timing guard, and anti-bot engine for Rust."
repository = "https://github.com/xuoxod/phylax"
readme = "README.md"
keywords = ["security", "anti-bot", "honeypot", "proof-of-work", "waf"]
categories = ["web-programming", "network-programming", "cryptography"]

[features]
default = []
abuse-reporting = ["dep:reqwest", "dep:async-trait", "dep:tracing"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
ipnet = "2.10"
base64 = "0.22"
parking_lot = "0.12"
thiserror = "1.0"
tokio = { version = "1.38", features = ["sync", "time", "rt"] }

# Optional Dependencies for Collaborative Abuse Reporting
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
async-trait = { version = "0.1", optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1.38", features = ["full", "test-util"] }
axum = "0.7"

[[example]]
name = "axum_edge_defense"
path = "examples/axum_edge_defense.rs"

[[example]]
name = "standalone_bloom"
path = "examples/standalone_bloom.rs"
